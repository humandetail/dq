<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:,">
    <title>TD3 · M3</title>
    <script type="module" src="/src/m2.ts"></script>
  </head>
  <body>
    <header>
      <div>
        <h1>TD3 · M3</h1>
        <p>55 波主线，档案保存在当前浏览器。</p>
      </div>
      <div class="controls">
        <button id="pause" disabled>暂停</button>
        <button id="speed" disabled>1×</button>
        <button id="restart" disabled>重开</button>
      </div>
    </header>
    <main>
      <div class="battlefield">
        <canvas id="field" aria-label="刀圈 TD 战场，浅绿色区域可建造"></canvas>
        <div class="battlefield-tools">
          <div class="map-key"><span class="build-key"></span>浅绿区域可建造 <span class="road-key"></span>土色道路行军</div>
          <div class="camera-panel">
            <div class="controls" role="group" aria-label="镜头控制">
              <button id="view-oblique" aria-pressed="true" disabled>斜俯视</button>
              <button id="view-top" aria-pressed="false" disabled>俯视</button>
              <button id="orbit-view" aria-pressed="false" title="拖动战场调整方向和角度" disabled>自由视角</button>
              <button id="rotate-left" aria-label="镜头向左旋转 45 度" title="向左旋转 45°" disabled>左转</button>
              <button id="rotate-right" aria-label="镜头向右旋转 45 度" title="向右旋转 45°" disabled>右转</button>
              <button id="zoom-in" aria-label="拉近镜头" title="拉近镜头" disabled>＋</button>
              <button id="zoom-out" aria-label="拉远镜头" title="拉远镜头" disabled>−</button>
              <button id="reset-view" aria-label="复位视角" title="复位视角" disabled>复位</button>
            </div>
            <p id="camera-status" role="status">斜俯视 · 朝向 180° · 145%</p>
            <p class="camera-help">中键拖动平移 · 自由视角可拖动旋转 · 滚轮缩放</p>
          </div>
        </div>
        <div class="placement-bar"><p id="placement-status" role="status">选择工人建造或塔卡，再点击浅绿建造区。</p><button id="cancel-placement" hidden>取消放置 · Esc</button></div>
      </div>
      <aside>
        <h2>对局</h2>
        <p id="resources"></p>
        <p id="wave"></p>
        <p id="boss"></p>
        <p id="last-hit" hidden></p>
        <div id="wave-rewards" class="controls"></div>
        <button id="overdraft" hidden>透支</button>
        <p id="feedback" role="status"></p>
        <p id="save" role="status">正在读取档案</p>
        <button id="cancel-save-wait" hidden>取消等待</button>
        <button id="retry-save" hidden>重试</button>
        <details><summary>季节任务与解锁</summary><div id="season-tasks"></div></details>
        <section>
          <h2>工人道具</h2>
          <div id="worker-benefits" class="controls"></div>
          <p id="worker-benefit-result" role="status"></p>
          <div id="worker-appearance" class="controls"></div>
          <div id="worker-items"></div>
        </section>
        <section>
          <h2>工人天赋</h2>
          <div id="talents" class="controls"></div>
        </section>
        <section id="opening" hidden>
          <h2>选择开局英雄</h2>
          <div id="choices" class="controls"></div>
        </section>
        <section>
          <h2>工人建造</h2>
          <p class="build-help">选一座塔 → 在地图浅绿区域放置</p>
          <div id="builds" class="controls"></div>
        </section>
        <details id="hero-exchange" hidden>
          <summary>英雄兑换</summary>
          <div id="hero-exchange-offers" class="controls"></div>
        </details>
        <details>
          <summary>活动商店</summary>
          <p id="event-balance"></p>
          <div id="event-boxes" class="controls"></div>
        </details>
        <section>
          <h2>抽卡</h2>
          <div id="draws" class="controls"></div>
        </section>
        <section>
          <h2>祈祷神庙</h2>
          <div id="prayer" class="controls"></div>
          <p id="books"></p>
        </section>
        <section>
          <h2>商店</h2>
          <div class="controls">
            <select id="ordinary-goods" aria-label="商店商品"></select>
            <button id="buy-ordinary" disabled>购买</button>
          </div>
        </section>
        <section id="mystery-shop" hidden>
          <h2>神秘商店</h2>
          <div id="mystery-stock" class="controls"></div>
        </section>
        <section id="challenge-shop" hidden>
          <h2>挑战商店</h2>
          <p id="challenge-status"></p>
          <div id="challenge-stock" class="controls"></div>
        </section>
        <section id="exchanges" hidden>
          <h2>资格兑换</h2>
          <p>每次消耗背包中前五张符合条件的 R 卡。</p>
          <select id="qualification" aria-label="兑换目标"></select>
          <button id="exchange" disabled>兑换</button>
        </section>
        <section>
          <h2>塔卡</h2>
          <div id="cards" class="controls"></div>
        </section>
        <section>
          <h2>已放置的塔</h2>
          <div id="structures"></div>
          <div id="circle-items"></div>
        </section>
        <details class="original-map-reference">
          <summary>原版地图资料</summary>
          <div class="original-map-images">
            <figure>
              <img src="/src/assets/original-icons/war3mapPreview.png" width="256" height="256" loading="lazy" alt="刀圈 TD 6.25 原版地图预览">
              <figcaption>地图预览</figcaption>
            </figure>
            <figure>
              <img src="/src/assets/original-icons/war3mapMap.png" width="256" height="256" loading="lazy" alt="刀圈 TD 6.25 原版小地图">
              <figcaption>原版小地图</figcaption>
            </figure>
          </div>
        </details>
      </aside>
    </main>
  </body>
</html>
