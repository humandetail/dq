name: Web checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check M2 configuration
        run: python3 tools/check-m2-configuration.py
      - run: npm ci
      - run: npm run check
