name: M2 preview Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: m2-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 tools/check-m2-configuration.py
      - run: node tools/build-m2-runtime-coverage.mjs --check
      - run: npm run check
      - run: node tools/prepare-pages.mjs
        env:
          M2_RELEASE_VERSION: m2-core-30-ui-1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Wait for the uploaded artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" = "1" ]; then
              sleep 10
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact is not available"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
